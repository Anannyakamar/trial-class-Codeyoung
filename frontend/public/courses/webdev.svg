<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="web-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F2"/>
      <stop offset="50%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F1ECFA"/>
    </linearGradient>
    <linearGradient id="laptop-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2833"/>
      <stop offset="100%" stop-color="#1A1822"/>
    </linearGradient>
    <filter id="web-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A2833" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#web-bg)"/>

  <!-- Laptop Base & Screen -->
  <g transform="translate(400, 245)" filter="url(#web-shadow)">
    <!-- Screen Frame -->
    <rect x="-190" y="-140" width="380" height="240" rx="16" fill="#4B4856"/>
    <!-- Screen Display -->
    <rect x="-176" y="-126" width="352" height="212" rx="8" fill="url(#laptop-screen)"/>

    <!-- Browser Tab Bar inside screen -->
    <rect x="-176" y="-126" width="352" height="24" rx="4" fill="#363442"/>
    <circle cx="-160" cy="-114" r="4" fill="#FF5733"/>
    <circle cx="-148" cy="-114" r="4" fill="#FBBF24"/>
    <circle cx="-136" cy="-114" r="4" fill="#2DD4BF"/>

    <!-- Left Code Editor Split -->
    <rect x="-166" y="-92" width="150" height="166" rx="6" fill="#1E1C27"/>
    <!-- Code lines -->
    <rect x="-156" y="-80" width="60" height="6" rx="3" fill="#FF7D60"/>
    <rect x="-156" y="-68" width="100" height="5" rx="2.5" fill="#9273D4"/>
    <rect x="-144" y="-56" width="80" height="5" rx="2.5" fill="#2DD4BF"/>
    <rect x="-144" y="-44" width="70" height="5" rx="2.5" fill="#FBBF24"/>
    <rect x="-156" y="-32" width="45" height="5" rx="2.5" fill="#FF7D60"/>

    <rect x="-156" y="-16" width="90" height="5" rx="2.5" fill="#9273D4"/>
    <rect x="-144" y="-4" width="65" height="5" rx="2.5" fill="#2DD4BF"/>
    <rect x="-144" y="8" width="85" height="5" rx="2.5" fill="#FFAB97"/>

    <!-- Right Live UI Preview Split -->
    <rect x="-6" y="-92" width="170" height="166" rx="6" fill="#FAF8F5"/>
    <!-- Hero block preview -->
    <rect x="6" y="-80" width="146" height="50" rx="6" fill="#FF7D60" fill-opacity="0.2"/>
    <rect x="16" y="-70" width="80" height="8" rx="4" fill="#E84723"/>
    <rect x="16" y="-56" width="60" height="5" rx="2.5" fill="#71707A"/>
    <rect x="16" y="-44" width="35" height="8" rx="4" fill="#E84723"/>

    <!-- Grid cards preview -->
    <rect x="6" y="-20" width="68" height="42" rx="4" fill="#8E7DBE" fill-opacity="0.2"/>
    <rect x="84" y="-20" width="68" height="42" rx="4" fill="#2DD4BF" fill-opacity="0.2"/>
    <rect x="6" y="30" width="68" height="34" rx="4" fill="#FBBF24" fill-opacity="0.2"/>
    <rect x="84" y="30" width="68" height="34" rx="4" fill="#E84723" fill-opacity="0.2"/>

    <!-- Laptop Hinge & Keyboard Base -->
    <path d="M -230,100 L 230,100 L 200,120 L -200,120 Z" fill="#6B6878"/>
    <rect x="-40" y="102" width="80" height="5" rx="2" fill="#4B4856"/>
  </g>

  <!-- Floating Tags / Badges -->
  <g transform="translate(130, 140)" filter="url(#web-shadow)">
    <rect width="120" height="46" rx="14" fill="#FFFFFF"/>
    <text x="60" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#E84723" text-anchor="middle">&lt;HTML5 /&gt;</text>
  </g>

  <g transform="translate(560, 120)" filter="url(#web-shadow)">
    <rect width="110" height="46" rx="14" fill="#FFFFFF"/>
    <text x="55" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#7B5ABF" text-anchor="middle">{ CSS3 }</text>
  </g>

  <g transform="translate(570, 310)" filter="url(#web-shadow)">
    <rect width="100" height="44" rx="14" fill="#FFFFFF"/>
    <text x="50" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#D97706" text-anchor="middle">JS (ES6)</text>
  </g>
</svg>
