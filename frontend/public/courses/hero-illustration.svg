<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7D60"/>
      <stop offset="100%" stop-color="#E84723"/>
    </linearGradient>
    <linearGradient id="hero-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFBFEE"/>
      <stop offset="100%" stop-color="#8E7DBE"/>
    </linearGradient>
    <linearGradient id="hero-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0EC"/>
      <stop offset="100%" stop-color="#FAF8F5"/>
    </linearGradient>
    <filter id="hero-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2A2833" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Soft Aura Glow -->
  <circle cx="350" cy="270" r="230" fill="url(#hero-glow)"/>
  <ellipse cx="440" cy="220" rx="180" ry="140" fill="#F1ECFA" opacity="0.6"/>
  <ellipse cx="260" cy="300" rx="160" ry="120" fill="#FFEAE4" opacity="0.7"/>

  <!-- Orbiting Rings & Learning Nodes -->
  <ellipse cx="350" cy="280" rx="260" ry="110" fill="none" stroke="#B099E2" stroke-width="2" stroke-dasharray="6,6" opacity="0.5" transform="rotate(-15, 350, 280)"/>

  <!-- Central Student Workspace (Desk, Laptop, Code Elements) -->
  <g transform="translate(350, 310)" filter="url(#hero-shadow)">
    <!-- Desk Surface -->
    <ellipse cx="0" cy="110" rx="220" ry="30" fill="#EDE4D5"/>
    <ellipse cx="0" cy="115" rx="180" ry="20" fill="#DFD6C5"/>

    <!-- Open Laptop on Desk -->
    <rect x="-110" y="-70" width="220" height="140" rx="14" fill="#363442"/>
    <rect x="-100" y="-60" width="200" height="120" rx="8" fill="#1C1A24"/>
    
    <!-- Screen Content: Creative Game & Code -->
    <rect x="-90" y="-50" width="85" height="100" rx="4" fill="#2A2833"/>
    <rect x="-82" y="-40" width="40" height="5" rx="2" fill="#FF7D60"/>
    <rect x="-82" y="-30" width="65" height="4" rx="2" fill="#9273D4"/>
    <rect x="-76" y="-20" width="50" height="4" rx="2" fill="#2DD4BF"/>
    <rect x="-76" y="-10" width="60" height="4" rx="2" fill="#FBBF24"/>
    <rect x="-82" y="5" width="55" height="4" rx="2" fill="#FFAB97"/>
    <rect x="-82" y="15" width="45" height="4" rx="2" fill="#9273D4"/>
    <rect x="-76" y="25" width="60" height="4" rx="2" fill="#2DD4BF"/>

    <!-- Right Side Game Canvas Preview on Laptop -->
    <rect x="5" y="-50" width="85" height="100" rx="4" fill="#FFF5F2"/>
    <!-- Small Rocket in Game Canvas -->
    <path d="M 47,-35 L 55,-15 L 40,-15 Z" fill="#FF5733"/>
    <rect x="44" y="-15" width="7" height="18" fill="#E84723"/>
    <polygon points="38,-5 44,-5 44,5 38,0" fill="#8E7DBE"/>
    <polygon points="57,-5 51,-5 51,5 57,0" fill="#8E7DBE"/>
    <polygon points="43,3 47,15 51,3" fill="#F59E0B"/>
    <!-- Stars in Game -->
    <circle cx="20" cy="-35" r="3" fill="#FBBF24"/>
    <circle cx="75" cy="-25" r="2.5" fill="#9273D4"/>
    <circle cx="25" cy="15" r="2" fill="#FF7D60"/>
    <circle cx="70" cy="25" r="3" fill="#2DD4BF"/>

    <!-- Laptop Base -->
    <path d="M -140,70 L 140,70 L 120,95 L -120,95 Z" fill="#52515A"/>
    <rect x="-30" y="72" width="60" height="4" rx="2" fill="#363442"/>
  </g>

  <!-- Floating Achievement & Curiosity Badges -->
  <!-- Badge 1: 1-on-1 Mentor Badge -->
  <g transform="translate(130, 130)" filter="url(#hero-shadow)">
    <rect width="180" height="60" rx="20" fill="#FFFFFF"/>
    <circle cx="34" cy="30" r="18" fill="#FF7D60"/>
    <text x="34" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">1:1</text>
    <text x="64" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#1C1A24">Live Mentorship</text>
    <text x="64" y="44" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#71707A">Personalized Pace</text>
  </g>

  <!-- Badge 2: Real Projects Badge -->
  <g transform="translate(430, 90)" filter="url(#hero-shadow)">
    <rect width="180" height="60" rx="20" fill="#FFFFFF"/>
    <circle cx="34" cy="30" r="18" fill="#8E7DBE"/>
    <text x="34" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" text-anchor="middle">🚀</text>
    <text x="64" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#1C1A24">Hands-on Coding</text>
    <text x="64" y="44" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#71707A">Build Real Games</text>
  </g>

  <!-- Badge 3: Confidence & STEM -->
  <g transform="translate(450, 390)" filter="url(#hero-shadow)">
    <rect width="190" height="54" rx="18" fill="#FFFFFF"/>
    <circle cx="30" cy="27" r="16" fill="#2DD4BF"/>
    <text x="30" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" text-anchor="middle">✨</text>
    <text x="56" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#1C1A24">STEM Accredited</text>
    <text x="56" y="40" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#71707A">Future-Ready Skills</text>
  </g>

  <!-- Floating Geometric & Sparkle Accents -->
  <polygon points="120,380 135,395 120,410 105,395" fill="#FF7D60" opacity="0.8"/>
  <polygon points="590,260 600,270 590,280 580,270" fill="#8E7DBE" opacity="0.8"/>
  <circle cx="270" cy="80" r="6" fill="#FBBF24"/>
  <circle cx="380" cy="70" r="4" fill="#FF7D60"/>
  <circle cx="160" cy="250" r="8" fill="#8E7DBE" opacity="0.4"/>
</svg>
