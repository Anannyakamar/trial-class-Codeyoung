<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sci-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1ECFA"/>
      <stop offset="60%" stop-color="#E8F6F3"/>
      <stop offset="100%" stop-color="#FAF8F5"/>
    </linearGradient>
    <linearGradient id="flask-liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="sci-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7D60"/>
      <stop offset="100%" stop-color="#8E7DBE"/>
    </linearGradient>
    <filter id="sci-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2A2833" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#sci-bg)"/>

  <!-- Orbital Rings (Atom model) -->
  <g transform="translate(240, 240)">
    <ellipse cx="0" cy="0" rx="100" ry="38" fill="none" stroke="#8E7DBE" stroke-width="2.5" opacity="0.6" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="100" ry="38" fill="none" stroke="#FF7D60" stroke-width="2.5" opacity="0.6" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="100" ry="38" fill="none" stroke="#14B8A6" stroke-width="2.5" opacity="0.6" transform="rotate(90)"/>
    <circle cx="0" cy="0" r="14" fill="#FF5733"/>
    <circle cx="65" cy="-35" r="7" fill="#8E7DBE"/>
    <circle cx="-65" cy="-35" r="7" fill="#14B8A6"/>
    <circle cx="0" cy="80" r="6" fill="#FF8C72"/>
  </g>

  <!-- Central Erlenmeyer Flask & Reactions -->
  <g transform="translate(500, 160)" filter="url(#sci-shadow)">
    <!-- Flask Glass outline -->
    <path d="M 60,0 L 80,0 L 80,50 L 140,180 A 16,16 0 0,1 126,200 L 14,200 A 16,16 0 0,1 0,180 L 60,50 Z"
          fill="#FFFFFF" fill-opacity="0.8" stroke="#64748B" stroke-width="4"/>
    <!-- Liquid inside -->
    <path d="M 30,130 C 50,120 90,140 110,130 L 126,196 A 12,12 0 0,1 120,200 L 20,200 A 12,12 0 0,1 14,196 Z"
          fill="url(#flask-liquid)" opacity="0.9"/>
    
    <!-- Bubbles -->
    <circle cx="70" cy="155" r="7" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="50" cy="170" r="5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="85" cy="180" r="4" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="68" cy="100" r="9" fill="#2DD4BF" opacity="0.7"/>
    <circle cx="74" cy="70" r="6" fill="#FF8C72" opacity="0.8"/>
    <circle cx="64" cy="40" r="5" fill="#8E7DBE" opacity="0.8"/>
    <circle cx="72" cy="15" r="4" fill="#FFAB97" opacity="0.9"/>
  </g>

  <!-- DNA Strand / Helix accent -->
  <g transform="translate(680, 160)" opacity="0.75">
    <path d="M 0,20 Q 25,60 0,100 T 0,180 T 0,260" fill="none" stroke="#FF6B4A" stroke-width="3"/>
    <path d="M 30,20 Q 5,60 30,100 T 30,180 T 30,260" fill="none" stroke="#8E7DBE" stroke-width="3"/>
    <line x1="12" y1="40" x2="18" y2="40" stroke="#64748B" stroke-width="2"/>
    <line x1="5" y1="80" x2="25" y2="80" stroke="#64748B" stroke-width="2"/>
    <line x1="12" y1="120" x2="18" y2="120" stroke="#64748B" stroke-width="2"/>
    <line x1="5" y1="160" x2="25" y2="160" stroke="#64748B" stroke-width="2"/>
    <line x1="12" y1="200" x2="18" y2="200" stroke="#64748B" stroke-width="2"/>
  </g>

  <!-- Microscope Silhouette badge -->
  <g transform="translate(140, 100)" filter="url(#sci-shadow)">
    <rect width="100" height="48" rx="16" fill="#FFFFFF" fill-opacity="0.9"/>
    <text x="50" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F766E" text-anchor="middle">H₂O + CO₂</text>
  </g>
</svg>
