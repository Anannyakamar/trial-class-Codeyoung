<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="py-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0EC"/>
      <stop offset="50%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F1ECFA"/>
    </linearGradient>
    <linearGradient id="py-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="py-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="py-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A2833" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#py-bg)"/>

  <!-- Code Terminal Window -->
  <g transform="translate(400, 230)" filter="url(#py-shadow)">
    <!-- Terminal Box -->
    <rect x="-210" y="-130" width="420" height="260" rx="20" fill="#1E1C27"/>
    <!-- Terminal Header -->
    <rect x="-210" y="-130" width="420" height="36" rx="6" fill="#2E2C3A"/>
    <circle cx="-185" cy="-112" r="5" fill="#FF5733"/>
    <circle cx="-170" cy="-112" r="5" fill="#FBBF24"/>
    <circle cx="-155" cy="-112" r="5" fill="#2DD4BF"/>
    <text x="0" y="-107" font-family="'Plus Jakarta Sans', monospace" font-size="12" font-weight="700" fill="#A1A0A9" text-anchor="middle">main.py — Python 3.12</text>

    <!-- Python Code Snippet -->
    <g transform="translate(-185, -70)" font-family="'Courier New', monospace" font-size="14" font-weight="700">
      <text y="0" fill="#FF7D60">import</text>
      <text x="65" y="0" fill="#FAF8F5">pygame, random</text>

      <text y="30" fill="#9273D4">def</text>
      <text x="35" y="30" fill="#FBBF24">start_game</text>
      <text x="125" y="30" fill="#FAF8F5">(player):</text>

      <text x="25" y="60" fill="#A1A0A9"># Level 1 Challenge</text>

      <text x="25" y="90" fill="#FAF8F5">score = </text>
      <text x="95" y="90" fill="#38BDF8">100</text>

      <text x="25" y="120" fill="#9273D4">if</text>
      <text x="50" y="120" fill="#FAF8F5">player.is_winner:</text>

      <text x="50" y="150" fill="#2DD4BF">print</text>
      <text x="95" y="150" fill="#FFAB97">("You built a game! 🚀")</text>
    </g>
  </g>

  <!-- Floating Python Brand Elements -->
  <g transform="translate(140, 160)" filter="url(#py-shadow)">
    <rect width="130" height="50" rx="16" fill="#FFFFFF"/>
    <text x="65" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#0284C7" text-anchor="middle">🐍 Python 3</text>
  </g>

  <g transform="translate(560, 140)" filter="url(#py-shadow)">
    <rect width="130" height="50" rx="16" fill="#FFFFFF"/>
    <text x="65" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#D97706" text-anchor="middle">🎮 Pygame Lab</text>
  </g>

  <g transform="translate(540, 310)" filter="url(#py-shadow)">
    <rect width="140" height="46" rx="16" fill="#FFFFFF"/>
    <text x="70" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#7B5ABF" text-anchor="middle">AI &amp; Logic Intro</text>
  </g>
</svg>
